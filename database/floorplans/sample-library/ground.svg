<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Sample Library ground floor</title>
  <desc id="desc">A compact schematic library floor plan with a welcome desk, reading room, study room and public computers.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="4">
    <rect x="120" y="160" width="100" height="80"/><rect x="240" y="160" width="120" height="80"/>
    <rect x="380" y="160" width="100" height="80"/><rect x="240" y="20" width="120" height="50"/>
  </g>
  <path d="M80 200H520V80H80Z" fill="none" stroke="#475569" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="300" y="45" font-size="28" font-weight="bold">Sample Library</text><text x="170" y="195">Welcome</text>
    <text x="300" y="195">Reading room</text><text x="430" y="195">Study room</text><text x="300" y="55">Computers</text>
    <text x="80" y="230" text-anchor="start">Entrance</text>
  </g>
</svg>
