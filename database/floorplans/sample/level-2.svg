<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Sample Mall level 2</title>
  <desc id="desc">A schematic upper-floor plan with entertainment, stairs and an elevator.</desc>
  <rect width="1000" height="700" fill="#f8fafc"/>
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="4">
    <rect x="140" y="280" width="120" height="90"/><rect x="260" y="280" width="120" height="90"/>
    <rect x="560" y="280" width="120" height="90"/><rect x="760" y="280" width="120" height="90"/>
    <rect x="420" y="70" width="150" height="70"/><rect x="80" y="70" width="150" height="70"/>
    <rect x="260" y="570" width="120" height="70"/><rect x="460" y="570" width="120" height="70"/>
    <rect x="660" y="570" width="120" height="70"/><rect x="880" y="570" width="100" height="70"/>
  </g>
  <g fill="none" stroke="#475569" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
